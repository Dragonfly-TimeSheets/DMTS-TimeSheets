<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f3f2f0;--card:#fff;--ink:#1d1d1f;--mute:#6b6b70;--line:#d9d7d3;--brand:#8b1a10;--navy:#2a2d7f;--inp:#fffbe6;--ok:#1d7a3a;--warn:#c25b00;}
:root:not([data-theme="light"]){color-scheme:light dark}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#161618;--card:#222226;--ink:#f1f0ee;--mute:#a0a0a8;--line:#3a3a40;--brand:#e0655a;--navy:#9ea2ff;--inp:#2b2a22;--ok:#5fd085;--warn:#ffa24d}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#161618;--card:#222226;--ink:#f1f0ee;--mute:#a0a0a8;--line:#3a3a40;--brand:#e0655a;--navy:#9ea2ff;--inp:#2b2a22;--ok:#5fd085;--warn:#ffa24d}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 Arial,Helvetica,sans-serif}
.wrap{max-width:900px;margin:0 auto;padding:14px}
h1{margin:0;font-size:20px;color:var(--brand)}h2{margin:2px 0 12px;font-size:14px;color:var(--navy);font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
.top{display:flex;gap:10px;align-items:end;flex-wrap:wrap}
label{display:block;font-size:12px;color:var(--mute);margin:0 0 3px;font-weight:600}
input,select,textarea{width:100%;font:inherit;color:var(--ink);background:var(--inp);border:1px solid var(--line);border-radius:8px;padding:9px;min-height:40px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--navy)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.sp2{grid-column:span 2}
.eh{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-weight:700;color:var(--navy)}
button{font:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:9px 14px;min-height:40px}
button.p{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:700}
button.x{color:var(--warn)}
.seg{display:flex;gap:6px}.seg button{flex:1}.seg button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.calc{display:flex;gap:14px;margin-top:10px;font-size:13px;color:var(--mute);flex-wrap:wrap}.calc b{color:var(--ink)}
.miss{border-color:var(--warn)}
.tot{display:flex;gap:18px;flex-wrap:wrap;font-weight:700}.tot span{color:var(--mute);font-weight:400;font-size:12px;display:block}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
#msg{font-size:13px;color:var(--ok);min-height:18px;margin-top:6px}
.hist button{display:block;width:100%;text-align:left;margin-bottom:6px}
.hist small{color:var(--mute)}
.note{font-size:12px;color:var(--mute)}.logo{display:block;max-width:300px;width:100%;height:auto;background:#fff;border-radius:8px;padding:4px;margin-bottom:8px}.bad{border-color:var(--warn)!important;outline:2px solid var(--warn)}#toast{position:fixed;left:12px;right:12px;top:calc(env(safe-area-inset-top,0px) + 8px);z-index:20;background:var(--warn);color:#fff;padding:10px 12px;border-radius:10px;font-weight:700;display:none}table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}th{color:var(--mute);font-size:12px}.reg th,.reg td{border:1px solid var(--line);padding:4px 6px;font-size:12px;text-align:center;white-space:nowrap}.reg tr.wk td{background:rgba(224,101,90,.2)}body.lock .card:not(#gate),body.lock #add,body.lock #logout,body.lock #chpw{display:none!important}body.office #entries,body.office #add,body.office .card:has(#date),body.office .card:has(#tot),body.office .card:has(#save),body.office .card.hist{display:none!important}
</style></head><body class="lock"><div class="wrap"><div class="card" id="gate" style="display:none"><img class="logo" alt="Dragonfly Mine Technical Services"><h2 id="gm"></h2><label>Your name</label><select id="gn"></select><label style="margin-top:8px">Password</label><input type="password" id="gp"><div id="gc" style="display:none"><label style="margin-top:8px">Repeat password</label><input type="password" id="gp2"></div><button class="p" id="gb" style="margin-top:12px;width:100%"></button><button id="gk" style="margin-top:8px;width:100%;display:none"></button><div id="ge" class="note" style="color:var(--warn);margin-top:8px"></div></div>
<div class="card"><img class="logo" alt="Dragonfly Mine Technical Services"><h2>Survey Team Daily Time Sheet: one sheet per day, one card per site</h2>
<div class="top"><div style="flex:1;min-width:160px"><label>Date</label><input type="date" id="date"></div>
<div id="day" style="padding-bottom:10px;font-weight:700;color:var(--navy)"></div></div></div>
<div id="entries"></div>
<button id="add" style="width:100%;margin-bottom:12px">+ Add another site for this day</button>
<div class="card"><div class="tot" id="tot"></div></div>
<div class="card"><div class="bar"><button class="p" id="save">Submit this day</button><button id="draft">Save as draft</button><button id="clr">Clear sheet</button><button id="pdf">Download this sheet as PDF</button><button id="exp">Download all as CSV</button><span class="note" id="where"></span></div><div id="msg"></div></div>
<div class="card hist"><label>Your drafts and submitted days</label><div id="hist"><span class="note">Nothing saved yet.</span></div></div>
<div class="card" id="admin" style="display:none"><div class="eh"><span>Admin report (only admins see this)</span></div><div class="grid"><div><label>From</label><input type="date" id="af"></div><div><label>To</label><input type="date" id="at"></div></div><div id="charts"></div><div id="rep"></div><label style="margin-top:16px;display:block">Monthly attendance register (IN / OUT)</label><input type="month" id="am" style="max-width:200px"><div id="reg"></div><label style="margin-top:16px;display:block">People (Reset puts someone back on their starting password; Deactivate stops someone signing in)</label><div id="logs"></div>
<div class="note" style="margin-top:12px">Add a new person. They start on a starting password and can choose their own.</div>
<div class="grid" style="margin-top:6px"><div class="sp2"><input id="np" placeholder="Full name, e.g. Thabo Mokoena"></div><div><select id="nr"><option value="crew">Crew</option><option value="admin">Admin (office only)</option></select></div><div><button id="npb" class="p">Add person</button></div></div><div id="npm" class="note" style="margin-top:6px"></div>
<label style="margin-top:16px;display:block">Dropdown lists (sites, clients, jobs)</label><div id="lists"></div><button id="aexp" style="margin-top:12px">Download admin CSV</button> <button id="apdf" style="margin-top:12px">Download admin PDF</button></div>
<button id="chpw" style="width:100%;margin-bottom:12px">Change my password</button><button id="logout" style="width:100%;margin-bottom:12px">Log out</button><datalist id="dl-site"></datalist><datalist id="dl-client"></datalist><datalist id="dl-staff"></datalist>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<script>
const SITES=[],CLIENTS=[],STAFF=[],JOBS=[],OFFICE=[];
const $=id=>document.getElementById(id);
const fill=(id,a)=>$(id).innerHTML=a.map(x=>`<option value="${x}">`).join('');
fill('dl-site',SITES);fill('dl-client',CLIENTS);fill('dl-staff',STAFF);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const blank=()=>({site:'',client:'',s:'',a1:'',a2:'',ss:'',se:'',ts:'',te:'',os:'',oe:'',o1:'',o2:'',h1:'',h2:'',t1:'',t2:'',job:'',stk:'',risk:'',note:''});
let entries=[blank()],date=new Date().toLocaleDateString('en-CA'),hist={},db=null;
const sp=(a,b)=>{if(!a||!b)return null;const[x,y]=a.split(':'),[c,d]=b.split(':');return(((c*60+ +d)-(x*60+ +y))%1440+1440)%1440/60};
const hrs=e=>{const v=[sp(e.ss,e.se),sp(e.ts,e.te),sp(e.os,e.oe)];return v.every(x=>x==null)?null:v.reduce((a,x)=>a+(x||0),0)};
const T=(id,v)=>$(id)&&($(id).textContent=v==null?'-':f2(v));
const pk=(a,b)=>(a==null||b==null||a===''||b==='')?null:b-a;
const km=e=>{const v=[pk(e.h1,e.h2),pk(e.t1,e.t2)];return v.every(x=>x==null)?null:v.reduce((a,x)=>a+(x||0),0)};
const f2=n=>n==null?'-':(Math.round(n*100)/100).toString();
function sel(i,k,arr,ph){return`<select data-i="${i}" data-k="${k}"><option value="">${ph}</option>${arr.map(x=>`<option${entries[i][k]===x?' selected':''}>${esc(x)}</option>`).join('')}</select>`}
function selp(i,k,l,arr){const v=entries[i][k];return`<div><label>${l}</label><select data-i="${i}" data-k="${k}"><option value="">Choose</option>${v&&!arr.includes(v)?`<option selected>${esc(v)}</option>`:''}${arr.map(x=>`<option${v===x?' selected':''}>${esc(x)}</option>`).join('')}</select></div>`}
function inp(i,k,l,t='text',dl='',extra=''){return`<div><label>${l}</label><input type="${t}" ${dl?`list="${dl}"`:''} ${extra} data-i="${i}" data-k="${k}" value="${esc(entries[i][k])}"></div>`}
function render(){
 $('date').value=date;$('day').textContent=new Date(date+'T00:00').toLocaleDateString('en-ZA',{weekday:'long'});
 $('entries').innerHTML=entries.map((e,i)=>`<div class="card"><div class="eh"><span>Site entry ${i+1}</span>${entries.length>1?`<button class="x" data-del="${i}">Remove</button>`:''}</div>
 <div class="grid">${selp(i,'site','Site *',SITES)}${selp(i,'client','Client *',CLIENTS)}
 ${selp(i,'s','Surveyor / Pilot',STAFF)}${selp(i,'a1','Assistant / Pilot',STAFF)}${selp(i,'a2','Assistant 2',STAFF)}
 ${inp(i,'ts','Travelling time: start','time')}${inp(i,'te','Travelling time: end','time')}${inp(i,'os','Office time: start','time')}${inp(i,'oe','Office time: end','time')}${inp(i,'ss','Survey time: start','time')}${inp(i,'se','Survey time: end','time')}
 ${[['h1','Home to Office: opening odometer'],['h2','Home to Office: closing odometer'],['t1','Office to Site / Home: opening odometer'],['t2','Office to Site / Home: closing odometer']].map(([k,l])=>inp(i,k,l,'number','','inputmode="numeric"')).join('')}
 <div class="sp2"><label>Job description *</label>${sel(i,'job',JOBS,'Choose')}</div>
 ${inp(i,'stk','Wood stakes used *','number','','inputmode="numeric"')}
 <div><label>Risk assessment done? *</label><div class="seg"><button data-r="${i}" data-v="YES" class="${e.risk==='YES'?'on':''}">YES</button><button data-r="${i}" data-v="No" class="${e.risk==='No'?'on':''}">No</button></div></div>
 <div class="sp2"><label>Notes (explain here if you chose OTHER)</label><input data-i="${i}" data-k="note" value="${esc(e.note)}"></div></div>
 <div class="calc">Travelling: <b id="th${i}"></b> h Office: <b id="oh${i}"></b> h Survey: <b id="sh${i}"></b> h Total: <b id="h${i}"></b> h Distance: <b id="k${i}"></b> km</div></div>`).join('');
 calc();
}
function calc(){let H=0,K=0,S=0,A=0,B=0,C=0,KH=0,KT=0;
 entries.forEach((e,i)=>{const h=hrs(e),k=km(e);H+=h||0;K+=k||0;S+=+e.stk||0;A+=sp(e.ss,e.se)||0;B+=sp(e.ts,e.te)||0;C+=sp(e.os,e.oe)||0;KH+=pk(e.h1,e.h2)||0;KT+=pk(e.t1,e.t2)||0;
  T('h'+i,h);T('sh'+i,sp(e.ss,e.se));T('th'+i,sp(e.ts,e.te));T('oh'+i,sp(e.os,e.oe));$('k'+i)&&($('k'+i).textContent=f2(k));
  $('k'+i)&&$('k'+i).style.setProperty('color',k<0?'var(--warn)':'')});
 $('tot').innerHTML=`<div><span>Sites</span>${entries.filter(e=>e.site).length}</div><div><span>Travelling h</span>${f2(B)}</div><div><span>Office h</span>${f2(C)}</div><div><span>Survey h</span>${f2(A)}</div><div><span>Total hours</span>${f2(H)}</div><div><span>Home to Office km</span>${f2(KH)}</div><div><span>Office to Site/Home km</span>${f2(KT)}</div><div><span>Total km</span>${f2(K)}</div><div><span>Wood stakes</span>${S}</div>`}
$('entries').addEventListener('input',ev=>{const t=ev.target;if(t.dataset.k){t.classList.remove('bad');entries[t.dataset.i][t.dataset.k]=t.value;calc()}});
$('entries').addEventListener('click',ev=>{const t=ev.target;
 if(t.dataset.del!=null){entries.splice(+t.dataset.del,1);render()}
 if(t.dataset.r!=null){entries[t.dataset.r].risk=t.dataset.v;render()}});
$('add').onclick=()=>{const l=entries[entries.length-1];entries.push({...blank(),client:l.client,s:l.s,a1:l.a1,a2:l.a2});render();window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'})};
function say(t,bad){$('msg').textContent=t;$('msg').style.color=bad?'var(--warn)':'var(--ok)'}
function missing(){const out=[];entries.forEach((e,i)=>{['site','client','job','stk','risk'].forEach(k=>{if(e[k]===''||e[k]==null)out.push(i+1)});if([e.site,e.client,e.job].includes('OTHER')&&!(e.note||'').trim())out.push(i+1);if(hrs(e)==null||(km(e)==null&&e.site!=='Office')||[pk(e.h1,e.h2),pk(e.t1,e.t2)].some(x=>x<0))out.push(i+1);[['h1','h2'],['t1','t2']].forEach(([a,b])=>{if((e[a]===''||e[a]==null)!==(e[b]===''||e[b]==null))out.push(i+1)});[['ss','se'],['ts','te'],['os','oe']].forEach(([a,b])=>{if(!e[a]!==!e[b])out.push(i+1)})});return[...new Set(out)]}
$('save').onclick=async()=>{const pr=probs(),m=pr.map(x=>x.i+1);
 if(m.length){showProbs(pr);return}
 const prev=(!editing&&hist[date])?hist[date].entries:[];const rec={date,entries:prev.concat(entries),savedAt:Date.now()};
 try{if(db&&uid){await db.collection('submissions').doc(uid).set({uid,name:me,days:{...hist,[date]:rec}});await db.collection('data/users/'+uid).doc(date).set(rec)}else{const a=JSON.parse(localStorage.getItem('ts')||'{}');a[date]=rec;localStorage.setItem('ts',JSON.stringify(a));hist=a;drawHist()}try{if(drafts[date]){if(db&&uid)await db.collection('data/users/'+uid).doc('draft-'+date).delete();else{delete drafts[date];localStorage.setItem('tsd',JSON.stringify(drafts))}}}catch(e){}entries=[blank()];if(me&&me!=='None')entries[0].s=me;editing=false;render();window.scrollTo({top:0,behavior:'smooth'});say((db&&uid?'Submitted for '+date+'. Your admin can see it now.':'Saved on this device only (not sent to admin).')+' The sheet is cleared for the next one.')}
 catch(e){say('Could not save: '+(e.message||e.code||'error'),true)}};
function drawHist(){const k=Object.keys(hist).sort().reverse();
 $('hist').innerHTML=k.length?k.map(d=>{const r=hist[d],H=r.entries.reduce((a,e)=>a+(hrs(e)||0),0);return`<button data-d="${d}">${d} <small>${r.entries.length} site(s), ${f2(H)} h: ${esc(r.entries.map(e=>e.site).join(', '))}</small></button>`}).join(''):'<span class="note">Nothing saved yet.</span>'}

function load(d){date=d;const r=hist[d];editing=!!r;entries=r?JSON.parse(JSON.stringify(r.entries)):[blank()];render();say('')}
$('date').onchange=e=>{if(e.target.value)load(e.target.value)};
$('exp').onclick=async()=>{const rows=[['Date','Site','Client','Surveyor/Pilot','Assistant/Pilot','Assistant 2','Travel Start','Travel End','Office Start','Office End','Survey Start','Survey End','Travel h','Office h','Survey h','Total h','Home-Office Open','Home-Office Close','Office-Site/Home Open','Office-Site/Home Close','Travel KM','Job','Wood Stakes','Risk Assessment','Notes']];
 Object.keys(hist).sort().forEach(d=>hist[d].entries.forEach(e=>rows.push([d,e.site,e.client,e.s,e.a1,e.a2,e.ts,e.te,e.os,e.oe,e.ss,e.se,f2(sp(e.ts,e.te)),f2(sp(e.os,e.oe)),f2(sp(e.ss,e.se)),f2(hrs(e)),e.h1,e.h2,e.t1,e.t2,f2(km(e)),e.job,e.stk,e.risk,e.note])));
 const csv=rows.map(r=>r.map(c=>`"${String(c??'').replace(/"/g,'""')}"`).join(',')).join('\n');
 try{const dn=await claude.use('downloads');if(!dn){say('Download not available here.',true);return}await dn.save({filename:'survey-timesheets.csv',data:csv})}catch(e){say('Download cancelled.',true)}};
render();
let uid=null,all={},editing=false;const recs=()=>Object.values(all).flatMap(d=>Object.values(d.days||{}).map(r=>({...r,uid:d.uid})));
function drawAdmin(){const f=$('af').value,t=$('at').value,S={},P={};
 recs().filter(r=>(!f||r.date>=f)&&(!t||r.date<=t)).forEach(r=>(r.entries||[]).forEach(e=>{const a=sp(e.ss,e.se)||0,b=sp(e.ts,e.te)||0,c=sp(e.os,e.oe)||0;
  const s=S[e.site||'(no site)']??={d:new Set(),a:0,b:0,c:0,k:0,kh:0,kt:0,ks:0,w:0,j:{},dd:{}};
  s.d.add(r.date);s.a+=a;s.b+=b;s.c+=c;s.k+=km(e)||0;s.kh+=pk(e.h1,e.h2)||0;s.kt+=pk(e.t1,e.t2)||0;const dy=(s.dd[r.date]??={j:{},n:[],h:0,k:0});if(e.job)dy.j[e.job]=(dy.j[e.job]||0)+1;if(e.note)dy.n.push(e.note);dy.h+=a+b+c;dy.k+=km(e)||0;s.w+=+e.stk||0;if(e.job)s.j[e.job]=(s.j[e.job]||0)+1;
  new Set([e.s,e.a1,e.a2].filter(n=>n&&n!=='None')).forEach(n=>{const p=P[n]??={a:0,b:0,c:0};p.a+=a;p.b+=b;p.c+=c})}));
 const tb=(h,r)=>`<div style="overflow-x:auto;margin-top:6px"><table><thead><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${r.join('')||'<tr><td>No data</td></tr>'}</tbody></table></div>`;
 const G=Object.values(S).reduce((x,s)=>({kh:x.kh+s.kh,kt:x.kt+s.kt,ks:x.ks+s.ks,k:x.k+s.k}),{kh:0,kt:0,ks:0,k:0});
 const totalsHtml=`<p style="margin:8px 0;font-size:13px"><b>All sites: Home to Office ${f2(G.kh)} km | Office to Site to Home ${f2(G.kt)} km | Total ${f2(G.k)} km</b></p>`;
 const dr=[];Object.keys(S).sort().forEach(n=>Object.keys(S[n].dd).sort().forEach(d=>{const y=S[n].dd[d];dr.push(`<tr><td>${esc(n)}</td><td>${d}</td><td>${Object.entries(y.j).map(([j,q])=>esc(j)+' x'+q).join(', ')||'-'}</td><td>${f2(y.h)}</td><td>${f2(y.k)}</td><td>${esc(y.n.join('; '))}</td></tr>`)}));
 const dailyHtml=`<label style="margin-top:16px">What we did at each site, each day</label>`+tb(['Site','Date','Work done (times)','Hours','Km','Notes'],dr);
 const sk=Object.keys(S).sort(),pk2=Object.keys(P).sort(),J={};Object.values(S).forEach(s=>Object.entries(s.j).forEach(([j,q])=>J[j]=(J[j]||0)+q));const jk=Object.keys(J).sort((x,y)=>J[y]-J[x]),T3=Object.values(S).reduce((x,s)=>[x[0]+s.b,x[1]+s.c,x[2]+s.a],[0,0,0]);
 CH={site:{l:sk,v:sk.map(n=>S[n].a+S[n].b+S[n].c)},person:{l:pk2,v:pk2.map(n=>P[n].a+P[n].b+P[n].c)},type:{l:['Travelling','Office','Survey'],v:T3},jobs:{l:jk,v:jk.map(j=>J[j])}};drawCharts();
 $('rep').innerHTML=`<label style="margin-top:12px">By site</label>`+tb(['Site','Days','Travelling h','Office h','Survey h','Total h','Home>Office km','Office>Site>Home km','Total km','Stakes','Work done'],Object.keys(S).sort().map(n=>{const s=S[n];return`<tr><td>${esc(n)}</td><td>${s.d.size}</td><td>${f2(s.b)}</td><td>${f2(s.c)}</td><td>${f2(s.a)}</td><td><b>${f2(s.a+s.b+s.c)}</b></td><td>${f2(s.kh)}</td><td>${f2(s.kt)}</td><td><b>${f2(s.k)}</b></td><td>${s.w}</td><td>${Object.entries(s.j).map(([j,q])=>esc(j)+' x'+q).join(', ')}</td></tr>`}))
 +totalsHtml+dailyHtml+`<label style="margin-top:16px">By person</label>`+tb(['Name','Travelling h','Office h','Survey h','Total h'],Object.keys(P).sort().map(n=>{const p=P[n];return`<tr><td>${esc(n)}</td><td>${f2(p.b)}</td><td>${f2(p.c)}</td><td>${f2(p.a)}</td><td><b>${f2(p.a+p.b+p.c)}</b></td></tr>`}))}

 if(!tot){x.font='13px Arial';x.fillText('No data for this period',12,60);return c}
 if(kind==='bar'){const L=44,R=626,T=44,B=240,mx=Math.max(...v),n=v.length,w=(R-L)/n;
  x.lineWidth=1;x.strokeStyle=th.line;x.font='11px Arial';
  for(let i=0;i<=4;i++){const y=B-(B-T)*i/4;x.beginPath();x.moveTo(L,y);x.lineTo(R,y);x.stroke();x.fillStyle=th.fg;x.textAlign='right';x.fillText((mx*i/4).toFixed(1),L-4,y+4)}
  v.forEach((val,i)=>{const h=(B-T)*val/mx,bx=L+i*w+w*0.15;x.fillStyle=PAL[i%PAL.length];x.fillRect(bx,B-h,w*0.7,h);x.fillStyle=th.fg;x.textAlign='center';x.fillText(val.toFixed(1),bx+w*0.35,B-h-4);
   x.save();x.translate(bx+w*0.35,B+10);x.rotate(Math.PI/4);x.textAlign='left';x.fillText(l[i].length>16?l[i].slice(0,15)+'...':l[i],0,0);x.restore()})}
 else{const cx=160,cy=185,r=110;let a0=-Math.PI/2;
  v.forEach((val,i)=>{const a1=a0+2*Math.PI*val/tot;x.fillStyle=PAL[i%PAL.length];x.beginPath();x.moveTo(cx,cy);x.arc(cx,cy,r,a0,a1);x.closePath();x.fill();x.strokeStyle=th.bg;x.lineWidth=2;x.stroke();
   const m=(a0+a1)/2;if(val/tot>0.04){x.fillStyle='#fff';x.font='bold 12px Arial';x.textAlign='center';x.fillText(Math.round(100*val/tot)+'%',cx+Math.cos(m)*r*0.65,cy+Math.sin(m)*r*0.65+4)}a0=a1});
  x.textAlign='left';x.font='12px Arial';
  l.forEach((n,i)=>{const y=60+i*20;if(y>320)return;x.fillStyle=PAL[i%PAL.length];x.fillRect(320,y-10,12,12);x.fillStyle=th.fg;x.fillText((n.length>34?n.slice(0,33)+'...':n)+' ('+(v[i]%1?v[i].toFixed(1):v[i])+')',338,y)})}
 return c}
